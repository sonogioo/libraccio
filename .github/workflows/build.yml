name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepara la firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/libraccio.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/libraccio.jks" >> "$GITHUB_ENV"
          else
            echo "Nessun keystore: firma di debug."
          fi

      - name: Compila l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            export VERSION_NAME="0.0.$GITHUB_RUN_NUMBER-dev"
          fi
          export VERSION_CODE="$GITHUB_RUN_NUMBER"
          gradle :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "Libraccio-$VERSION_NAME.apk"
          ls -la Libraccio-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: libraccio-apk
          path: Libraccio-*.apk

      - name: Pubblica la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Libraccio-*.apk
          generate_release_notes: true
